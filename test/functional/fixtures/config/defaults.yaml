# Copy of the production defaults (application.yaml), used by @resource scenarios.
# Keep in sync with application.yaml.
webserver:
  host: 127.0.0.1
  port: 8080
  staticDir: static

defaults:
  simulationParameters:
    populationSize:
      min: 100
      max: 60000
    eliteCount: 10
    mutationRate: 0.07
    minRate: 0.005
    maxRate: 0.995
    maxEpochsCount: 20000
    windowSize: 50
# Job housekeeping: same as application.yaml.
jobs:
  maxActiveJobs: 0
  idleTimeout: 10m
