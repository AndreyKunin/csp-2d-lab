# Quality profile (nightly, @quality): realistic population, more epochs.
webserver:
  host: 127.0.0.1
  port: 8080
  staticDir: static

defaults:
  simulationParameters:
    populationSize:
      min: 100
      max: 1000
    eliteCount: 10
    mutationRate: 0.07
    crossoverRate: 0.75
    maxEpochsCount: 3000
    windowSize: 50
    cycleCount: 10
    tournamentSize: 5
    repairWeight: 3
    flipWeight: 1
    donorFraction: 0.5
