# Quality profile (nightly, @quality): realistic population, more epochs.
webserver:
  host: 127.0.0.1
  port: 8080
  staticDir: static

defaults:
  simulationParameters:
    populationSize:
      min: 100
      max: 1000
    eliteCount: 10
    mutationRate: 0.07
    crossoverRate: 0.75
    minRate: 0.005
    maxRate: 0.995
    maxEpochsCount: 3000
    windowSize: 50
