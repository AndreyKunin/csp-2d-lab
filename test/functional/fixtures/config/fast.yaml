# Fast profile for the PR gate: small populations, few epochs.
# Host and port are overridden by the harness via SERVER_HOST / SERVER_PORT.
webserver:
  host: 127.0.0.1
  port: 8080
  staticDir: static

defaults:
  simulationParameters:
    populationSize:
      min: 20
      max: 60
    eliteCount: 5
    mutationRate: 0.07
    crossoverRate: 0.75
    maxEpochsCount: 200
    windowSize: 10
    cycleCount: 10
    tournamentSize: 5
    repairWeight: 3
    flipWeight: 1
    donorFraction: 0.5

# Job housekeeping: small values so FT-RSC-05 / FT-RSC-06 observe them quickly.
jobs:
  maxActiveJobs: 8
  idleTimeout: 10s
